[package]
name = "pat"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "pat"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
solana-instructions-sysvar = "3.0.1"
solana-instruction = "3.5.1"
solana-sdk-ids = "3.1.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-address = "2.9"
solana-keypair = "3.0"
solana-signer = "3.0"
solana-message = "3.0"
solana-transaction = "3.0"
solana-instruction = "3.5"
solana-sdk-ids = "3.1"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
